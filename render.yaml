services:
  - type: web
    name: advocacia-erp
    runtime: docker
    plan: free
    healthCheckPath: /index.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advocacia-db
          property: connectionString
      - key: DOLIBARR_URL_ROOT
        value: https://advocacia-erp.onrender.com
      - key: PHP_MEMORY_LIMIT
        value: "256M"
      - key: PHP_MAX_EXECUTION_TIME
        value: "120"

databases:
  - name: advocacia-db
    databaseName: advocacia_db
    plan: free
    ipAllowList: []